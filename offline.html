<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین - +lifeBOSPro</title>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0f;
            color: #e0e0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background: #1e1e2e;
            padding: 32px;
            border-radius: 24px;
            max-width: 300px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p {
            color: #b0b0c8;
            margin-bottom: 20px;
        }

        button {
            background: #6c5ce7;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>بدون اتصال به اینترنت</h1>
        <p>لطفاً اتصال خود را بررسی کنید و دوباره تلاش نمایید.</p>
        <button onclick="location.reload()">تلاش مجدد</button>
    </div>
</body>

</html>
